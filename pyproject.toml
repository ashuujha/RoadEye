[project]
name = "roadeye"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.115.12", "uvicorn==0.34.2", "pydantic==2.11.4",
  "pydantic-settings==2.9.1", "sqlalchemy==2.0.41", "alembic==1.15.2",
  "psycopg[binary]==3.2.9",
]

[project.optional-dependencies]
recorded = [
    "av==15.1.0",
    "numpy==2.2.6",
    "onnxruntime==1.22.1",
    "opencv-python-headless==4.11.0.86",
    "pillow==11.2.1",
]
[dependency-groups]
dev = ["pytest==8.3.5", "httpx==0.28.1", "ruff==0.11.10", "mypy==1.15.0"]
[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["packages/roadeye"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.12"
check_untyped_defs = true
files = ["packages/roadeye", "apps/api", "apps/worker"]
