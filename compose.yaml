name: roadeye
services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: roadeye
      POSTGRES_PASSWORD: ${ROADEYE_DB_PASSWORD:?Run make setup first}
      POSTGRES_DB: roadeye
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["roadeye_pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roadeye -d roadeye"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build: {context: ., dockerfile: apps/api/Dockerfile}
    env_file: .env
    environment:
      ROADEYE_DATABASE_URL: postgresql+psycopg://roadeye:${ROADEYE_DB_PASSWORD}@db:5432/roadeye
    ports: ["127.0.0.1:8000:8000"]
    command: ["sh", "-c", "alembic upgrade head && uvicorn apps.api.main:app --host 0.0.0.0 --port 8000"]
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/v1/health/ready')"]
      interval: 5s
      timeout: 3s
      retries: 20
  worker:
    build: {context: ., dockerfile: apps/api/Dockerfile}
    env_file: .env
    environment:
      ROADEYE_DATABASE_URL: postgresql+psycopg://roadeye:${ROADEYE_DB_PASSWORD}@db:5432/roadeye
    command: ["python", "-m", "apps.worker.main"]
    depends_on:
      api: {condition: service_healthy}
    restart: on-failure
  web:
    build: {context: apps/web, dockerfile: Dockerfile}
    environment:
      API_PROXY: http://api:8000
    ports: ["127.0.0.1:5173:5173"]
    depends_on:
      api: {condition: service_healthy}
volumes:
  roadeye_pg:
